<div class="container">
    <div>
        <h2>Ajouter un Film :</h2>
    </div>
    <form>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Film</label>
            <input type="text" [(ngModel)]="newFilm.nomfilm" name="nomfilm" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Note Film</label>
            <input type="number" [(ngModel)]="newFilm.notefilm" name="notefilm" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date de sortie</label>
            <input type="Date" [(ngModel)]="newFilm.dateSortie" name="dateSortie" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Genre</label>
            <select class="form-control" id="idgenre" name="idgenre" [(ngModel)]="newIdGenre">
                @for(form of genre; track form.idgenre){
                <option [value]="form.idgenre"> {{form.titregenre}} </option>
                }
            </select>
        </div>
        <div class="mt-2">
            <button type="submit" (click)="addFilm()" class="btn btn-success">Ajouter</button>
        </div>
    </form>
</div>

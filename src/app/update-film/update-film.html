<div class="container">
    <div>
        <h2>Modifier un Film :</h2>
    </div>
    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Film</label>
            <input readonly type="text" [(ngModel)]="currentFilm.idfilm" name="idfilm"
                class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Film</label>
            <input type="text" [(ngModel)]="currentFilm.nomfilm" name="nomfilm" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Note Film</label>
            <input type="number" [(ngModel)]="currentFilm.notefilm" name="notefilm"
                class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date de sortie</label>
            <input type="date" [ngModel]="currentFilm.dateSortie | date: 'yyyy-MM-dd'"
                (ngModelChange)=" currentFilm.dateSortie= $event" name="dateSortie" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Genre</label>
            <select class="form-control" id="idgenre" name="idgenre" [(ngModel)]="updateGenreId">
                @for(form of genre; track form.idgenre)
                {
                <option [value]="form.idgenre"> {{form.titregenre}} </option>
                }
            </select>
        </div>
        <div class="mt-2">
            <button type="submit" (click)="updateFilm()" class="btn btn-success">Modifier</button>
        </div>
    </form>
</div>
